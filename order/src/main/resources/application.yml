server:
  port: 8666

spring:
  application:
    name: WELCOME-ORDER-SERVICE 
  boot:
    admin:
      client:
        url: http://localhost:1111/
        instance:
          prefer-ip: true # Forces Spring Boot Admin to target IP/Localhost

# --- ADDED: FORCE OPENAPI TO BROADCAST GATEWAY URL ---
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  servers:
    - url: http://localhost:8080
      description: API Gateway Base URL
# -----------------------------------------------------

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    hostname: localhost
    prefer-ip-address: true # Forces Eureka registration via IP/Localhost

management:
  endpoints:
    web:
      exposure:
        include: '*'
  endpoint:
    health:
      show-details: always
  tracing:
    sampling:
      probability: 1.0 # Trace 100% of requests (For dev only. In Prod, set to 0.1)
  zipkin:
    tracing:
      endpoint: "http://localhost:9411/api/v2/spans"