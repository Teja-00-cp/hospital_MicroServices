# Profile for running a second, throwaway instance of this service that api-autotest can read the
# OpenAPI document from, without disturbing the instance already registered in Eureka.
# Activate with:  --spring.profiles.active=apitest
# Nothing here changes the default configuration.
#
# The datasource points at a throwaway schema, NOT at microservice-user, so the generated
# POST/PUT/DELETE tests cannot touch real data. Create it once with:
#   CREATE DATABASE IF NOT EXISTS `microservice_user_apitest`;
# Hibernate builds the tables from the entities on first start.

server.port=8899

spring.datasource.url=jdbc:mysql://localhost:3306/microservice_user_apitest?createDatabaseIfNotExist=true

# Do not advertise this throwaway instance to the registry or the gateway.
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=true

# Safe here because the target is the throwaway schema, and it is what creates the tables.
spring.jpa.hibernate.ddl-auto=update

springdoc.api-docs.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
