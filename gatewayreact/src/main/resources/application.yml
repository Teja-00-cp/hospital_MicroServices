server:
  port: 8080
  tomcat:
    threads:
      max: 400      # Increase worker threads
    accept-count: 1000

spring:
  application:
    name: API-GATEWAY

  cloud:
    gateway:
      # --- ADDED: GLOBAL CORS TO FIX THE 401 OPTIONS ERROR ---
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
      # -------------------------------------------------------

      # 1. GATEWAY TIMEOUTS: Prevents Netty from cutting off slow responses early
      httpclient:
        connect-timeout: 8000     # 8 seconds in milliseconds
        response-timeout: 8s       # 8 seconds duration
      
      routes:
        # 1. Route to WELCOME-ORDER-SERVICE
        - id: welcome-service-route
          uri: lb://WELCOME-ORDER-SERVICE
          predicates:
            - Path=/order/**
          filters:
            - name: CircuitBreaker
              args:
                name: welcomeCircuitBreaker 
                fallbackUri: forward:/gateway-fallback/welcome 

        # 2. Route to BILL-SERVICE
        - id: greet-service-route
          uri: lb://BILL-SERVICE
          predicates:
            - Path=/bill/**
          filters:
            - name: CircuitBreaker
              args:
                name: billCircuitBreaker
                fallbackUri: forward:/gateway-fallback/bill

        # 3. Route to PAYMENT-SERVICE
        - id: payment-service-route
          uri: lb://PAYMENT-SERVICE
          predicates:
            - Path=/appointment/**
          filters:
            - name: CircuitBreaker
              args:
                name: paymentCircuitBreaker
                fallbackUri: forward:/gateway-fallback/payment

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

# 2. ACTUATOR CONFIGURATION: Exposes circuit breaker states via /actuator/health
management:
  endpoints:
    web:
      exposure:
        include: '*'
  endpoint:
    health:
      show-details: always
  health:
    circuitbreakers:
      enabled: true

# 3. RESILIENCE4J CONFIGURATION: Circuit Breaker Rules & Timeouts
resilience4j:
  circuitbreaker:
    instances:
      welcomeCircuitBreaker:
        registerHealthIndicator: true  # Allows Actuator to see this metric
        failureRateThreshold: 50
        waitDurationInOpenState: 15s
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
      billCircuitBreaker:
        registerHealthIndicator: true  # Allows Actuator to see this metric
        failureRateThreshold: 60
        waitDurationInOpenState: 10s
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
      paymentCircuitBreaker:
        registerHealthIndicator: true  # Allows Actuator to see this metric
        failureRateThreshold: 50
        waitDurationInOpenState: 15s
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10

  # TIMELIMITER: Prevents the circuit breaker from tripping on your 5-second sleep
  timelimiter:
    instances:
      welcomeCircuitBreaker:
        timeoutDuration: 8s
      billCircuitBreaker:
        timeoutDuration: 8s
      paymentCircuitBreaker:
        timeoutDuration: 8s