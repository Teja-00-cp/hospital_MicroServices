<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Consultation Payment</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .payment-card { max-width: 500px; margin: 50px auto; border: none; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .btn-pay { background-color: #007bff; border: none; padding: 12px; font-weight: bold; }
        .patient-welcome { color: #6c757d; font-size: 0.9rem; }
        #message-box { display: none; margin-top: 15px; }
        .timer-text { font-size: 0.95rem; color: #dc3545; font-weight: bold; background: #ffeaea; padding: 8px; border-radius: 8px; display: inline-block; }
    </style>
</head>
<body>

<div class="container">
    <div class="card payment-card">
        <div class="card-body p-4">
            <div class="text-center mb-2">
                <span class="patient-welcome">Hi, <span id="patientDisplayName" class="fw-bold text-dark">Guest</span>!</span>
            </div>
            <h3 class="text-center mb-3">Finalize Consultation</h3>
            
            <div class="text-center mb-4">
                <div class="timer-text">
                    ⏳ Time remaining to complete payment: <span id="countdownTimer" style="font-size: 1.2rem;">--:--</span>
                </div>
            </div>

            <div class="alert alert-info text-center" style="background-color: #e3f2fd; color: #084298; border-color: #b6d4fe;">
                <strong>🩺 Appointment Details:</strong> <br>
                <span id="displayTimeSlot" class="fw-bold" style="font-size: 1.1rem;">Loading time...</span>
            </div>
            
            <div id="message-box" class="alert d-flex align-items-center" role="alert"></div>

            <form id="paymentForm">
                <div class="mb-4">
                    <label for="doctorFee" class="form-label fw-bold">Consultation Fee</label>
                    <div class="input-group input-group-lg">
                        <span class="input-group-text">$</span>
                        <input type="number" class="form-control" id="doctorFee" placeholder="0.00" step="0.01" required readonly>
                    </div>
                    <small class="text-muted">This amount is retrieved from your appointment selection.</small>
                </div>

                <hr class="my-4">

                <button type="submit" class="btn btn-primary w-100 btn-pay mt-3" id="submitBtn">
                    Pay & Book <span id="displayAmount">$0.00</span>
                </button>
                
                <div class="text-center mt-3">
                    <a href="#" id="cancelPaymentLink" class="text-decoration-none small text-danger">← Cancel & Return to Booking</a>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script>
$(document).ready(function() {
    $.ajaxSetup({
        beforeSend: function(xhr) {
            const token = localStorage.getItem('jwtToken');
            if (token) {
                xhr.setRequestHeader('Authorization', 'Bearer ' + token);
            }
        }
    });
    // Try switching this back to sessionStorage if localStorage was returning null
    let username1 = sessionStorage.getItem('username');
    
    // Fallback: If it's still empty, try localStorage
    if (!username1) {
        username1 = localStorage.getItem('username');
    }
    const username = username1;
    // Read from LOCAL storage
    const draftString = localStorage.getItem('appointmentFormDraft');

    if (username) $('#patientDisplayName').text(username);

    if (!draftString) {
        alert("Session expired or no data found.");
        window.location.href = "BookAppointment.html";
        return;
    }

    const appointmentData = JSON.parse(draftString);

    // Auto-fill Fee
    if (appointmentData.doctorFee) {
        $('#doctorFee').val(appointmentData.doctorFee);
        $('#displayAmount').text('$' + parseFloat(appointmentData.doctorFee).toFixed(2));
    }

    // Populate the Date & Time box
    $('#displayTimeSlot').text(appointmentData.appointmentDate + " at " + appointmentData.timeSlot);

    // ==========================================
    // DYNAMIC SYNCED COUNTDOWN TIMER
    // ==========================================
    
    let expiryTime = localStorage.getItem('lockExpiryTime');
    if (!expiryTime) {
        expiryTime = Date.now() + 10 * 60 * 1000;
        localStorage.setItem('lockExpiryTime', expiryTime);
    }

    const timerInterval = setInterval(function() {
        const now = Date.now();
        const distance = expiryTime - now;

        // If time runs out
        if (distance <= 0) {
            clearInterval(timerInterval);
            $('#countdownTimer').text("00:00");
            $('#submitBtn').prop('disabled', true).text('Time Expired');
            
            alert("⏳ Your 10-minute reservation has expired. The time slot has been released.");
            
            // Automatically revert the slot on the backend
            $.ajax({
                type: 'POST',
                url: 'http://localhost:8080/appointment/revert',
                contentType: 'application/json',
                data: JSON.stringify({
                    patientId: appointmentData.patientId.toString(),
                    doctorId: appointmentData.doctorId.toString(),
                    date: appointmentData.appointmentDate,
                    timeSlot: appointmentData.timeSlot
                }),
                complete: function() {
                    // Clean up GLOBAL storage and kick them out
                    localStorage.removeItem('lockExpiryTime');
                    localStorage.removeItem('appointmentFormDraft');
                    window.location.href = "BookAppointment.html";
                }
            });
            return;
        }

        const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
        const seconds = Math.floor((distance % (1000 * 60)) / 1000);

        const formattedMinutes = minutes < 10 ? "0" + minutes : minutes;
        const formattedSeconds = seconds < 10 ? "0" + seconds : seconds;

        $('#countdownTimer').text(formattedMinutes + ":" + formattedSeconds);
    }, 1000); 

    // ==========================================

    // --- HANDLE CANCEL / BACK BUTTON ---
    $('#cancelPaymentLink').on('click', function(e) {
        e.preventDefault();
        
        $.ajax({
            type: 'POST',
            url: 'http://localhost:8080/appointment/revert',
            contentType: 'application/json',
            data: JSON.stringify({
                patientId: appointmentData.patientId.toString(),
                doctorId: appointmentData.doctorId.toString(),
                date: appointmentData.appointmentDate,
                timeSlot: appointmentData.timeSlot
            }),
            complete: function() {
                localStorage.removeItem('lockExpiryTime'); 
                localStorage.removeItem('appointmentFormDraft');
                window.location.href = "BookAppointment.html";
            }
        });
    });

    // --- HANDLE PAYMENT SUBMISSION ---
    $('#paymentForm').on('submit', function(e) {
        e.preventDefault();

        const $btn = $('#submitBtn');
        const $msg = $('#message-box');
        
        const billData = {
            patientName: username,
            totalAmount: $('#doctorFee').val()
        };

        clearInterval(timerInterval);
        $btn.prop('disabled', true).html('<span class="spinner-border spinner-border-sm"></span> Processing...');

        $.ajax({
            url: 'http://localhost:8080/bill/api/billing/pay/add',
            type: 'POST',
            contentType: 'application/json',
            data: JSON.stringify(billData),
            success: function(payResponse) {
                const status = (typeof payResponse === 'string') ? payResponse.trim().toLowerCase() : payResponse;
                
                if (status.includes("fail-fallback") || status.includes("unavailable")) {
                    $btn.prop('disabled', false).text('Pay & Book $' + parseFloat(appointmentData.doctorFee).toFixed(2));
                    $msg.addClass('alert-warning').html('<strong>⚠️ Service Unavailable:</strong> The payment system is experiencing heavy load. Please try again in a few minutes.').show();
                } 
                else if (status === "success" || payResponse.status === "success") {
                    $btn.text('Confirming Appointment Lock...');

                    $.ajax({
                        url: `http://localhost:8080/appointment/confirmLock?patientId=${appointmentData.patientId}`,
                        type: 'POST',
                        contentType: 'application/json',
                        data: JSON.stringify(appointmentData),
                        success: function() {
                            $msg.addClass('alert-success').html('<strong>✅ Success!</strong> Payment confirmed and appointment booked.').show();
                            
                            // 🧹 CLEAN UP GLOBAL STORAGE SO THEY CAN BOOK AGAIN LATER!
                            localStorage.removeItem('appointmentFormDraft');
                            localStorage.removeItem('lockExpiryTime');
                            
                            setTimeout(() => { window.location.href = "Patient-DashBoard.html"; }, 2500);
                        },
                        error: function(xhr) {
                            $btn.prop('disabled', false).text('Try Booking Again');
                            $msg.addClass('alert-danger').html('Payment was successful, but your 10-minute session expired. Please contact support.').show();
                        }
                    });
                } 
                else if (status === "fail") {
                    $btn.prop('disabled', false).text('Pay & Book $' + parseFloat(appointmentData.doctorFee).toFixed(2));
                    $msg.addClass('alert-danger').html('<strong>❌ Payment Declined:</strong> Your transaction could not be completed.').show();
                } 
                else {
                    $btn.prop('disabled', false).text('Pay & Book $' + parseFloat(appointmentData.doctorFee).toFixed(2));
                    $msg.addClass('alert-danger').html('<strong>Error:</strong> Unexpected server response.').show();
                }
            },
            error: function(xhr) {
                $btn.prop('disabled', false).text('Pay & Book $' + parseFloat(appointmentData.doctorFee).toFixed(2));
                $msg.addClass('alert-danger').html('<strong>🚨 Network Error:</strong> Cannot connect to the hospital servers.').show();
            }
        });
    });
});
</script>

</body>
</html>
