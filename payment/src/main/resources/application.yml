server:
  port: 7978

spring:
  application:
    name: PAYMENT-SERVICE   # must match Gateway route
  boot:
    admin:
      client:
        url: http://localhost:1111/
        instance:
          prefer-ip: true 

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    hostname: localhost
management:
  endpoints:
    web:
      exposure:
        include: '*'
  tracing:
    sampling:
      probability: 1.0 # Trace 100% of requests (For dev only. In Prod, set to 0.1)
  zipkin:
    tracing:
      endpoint: "http://localhost:9411/api/v2/spans"

# application.yml (Appointment Microservice)

resilience4j:
  circuitbreaker:
    instances:
      # Circuit Breaker specifically for the Feign client
      welcomeOrderServiceCircuit: 
        failureRateThreshold: 50
        waitDurationInOpenState: 100s
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 5
